spring.application.name=plataforma-eventos-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/gerenciamento_eventos
spring.datasource.username=postgres
spring.datasource.password=abc123
spring.jpa.hibernate.ddl-auto=validate
# baseline-on-migrate: o banco local já tinha a tabela users (criada antes do Flyway
# entrar no projeto). Num banco novo/vazio o Flyway roda normalmente desde a V1.
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
api.security.token.secret=tirardaqui
logging.level.org.springframework.security=DEBUG