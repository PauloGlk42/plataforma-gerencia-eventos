spring.config.import=optional:file:.env[.properties]
spring.application.name=plataforma-eventos-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gerenciamento_eventos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
# baseline-on-migrate: o banco local já tinha a tabela users (criada antes do Flyway
# entrar no projeto). Num banco novo/vazio o Flyway roda normalmente desde a V1.
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# sem valor padrão: é o segredo de assinatura do JWT, não pode ter fallback fraco versionado
api.security.token.secret=${JWT_SECRET}
# segredo de assinatura do código do ingresso (HMAC-SHA256); próprio, separado do JWT_SECRET
ingresso.security.secret=${INGRESSO_SECRET}
logging.level.org.springframework.security=DEBUG
# ausente/vazia: usa o CatalogoProviderLocal (~15 itens fixos), sem precisar de rede
ticketmaster.api.key=${TICKETMASTER_API_KEY:}
# origens (front-end) autorizadas a chamar a API via CORS, separadas por vírgula;
# vazia em dev porque o proxy do Vite evita CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# máximo de ingressos por setor em um mesmo pedido
app.pedido.limite-itens-por-setor=${PEDIDO_LIMITE_ITENS_POR_SETOR:6}
# minutos até a reserva pendente expirar e devolver o estoque
app.pedido.expiracao-minutos=${PEDIDO_EXPIRACAO_MINUTOS:10}